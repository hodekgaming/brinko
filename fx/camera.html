<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>BRINKO camera</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; color: #f3f3f5; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; }
  #top { position: fixed; left: 24px; top: 20px; display: flex; align-items: center; gap: 12px; pointer-events: none; }
  #top b { letter-spacing: .35em; font-size: 15px; text-shadow: 0 1px 6px rgba(0,0,0,.7); }
  #state { padding: 5px 12px; border-radius: 99px; background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.16);
    font-size: 12px; letter-spacing: .12em; }
  #close { position: fixed; right: 20px; top: 16px; width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(255,255,255,.25);
    background: rgba(0,0,0,.45); color: #fff; font-size: 20px; cursor: pointer; }
  #camsw { position: fixed; right: 72px; top: 16px; height: 42px; padding: 0 14px; border-radius: 21px; border: 1px solid rgba(255,255,255,.25);
    background: rgba(0,0,0,.45); color: #fff; font-size: 13px; cursor: pointer; display: none; max-width: 40vw; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  #hint { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); padding: 10px 18px; border-radius: 14px;
    background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.12); font-size: 14px; transition: opacity .6s; white-space: nowrap; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; font-size: 18px; color: #ddd;
    background: radial-gradient(circle, rgba(30,30,40,.6), #000); transition: opacity .8s; z-index: 5; }
  .card { background: rgba(16,16,22,.94); border: 1px solid rgba(255,255,255,.14); border-radius: 20px; padding: 26px 30px;
    max-width: 460px; text-align: center; line-height: 1.5; }
  .card h2 { margin: 6px 0 8px; font-size: 20px; color: #fff; } .card p { margin: 0 0 18px; color: #b9b9c4; font-size: 14.5px; }
  .card .row { display: flex; gap: 10px; justify-content: center; }
  .card button { border: 0; border-radius: 12px; padding: 11px 20px; font: 700 14px "Segoe UI", sans-serif; cursor: pointer; }
  .card .yes { color: #111; background: #fff; }
  .card .no { color: #eee; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.2); }
  .card small { display: block; margin-top: 14px; color: #80808c; font-size: 12px; }

  /* character picker */
  .nochars #picker, .nochars #newchar { display: none !important; }
  #picker { position: fixed; right: 18px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px;
    max-height: calc(100vh - 140px); overflow-y: auto; padding: 4px; scrollbar-width: none; }
  #picker::-webkit-scrollbar { display: none; }
  .ch { position: relative; width: 92px; flex: none; border-radius: 14px; overflow: hidden; cursor: pointer; background: #111;
    border: 2px solid rgba(255,255,255,.12); transition: border-color .2s, transform .2s cubic-bezier(.2,.8,.2,1); }
  .ch:hover { transform: translateX(-3px); border-color: rgba(255,255,255,.4); }
  .ch.on { border-color: #fff; }
  .ch .img { width: 100%; height: 92px; background-size: cover; background-position: center 25%; }
  .ch span { display: block; padding: 5px 6px 6px; font-size: 11.5px; font-weight: 600; text-align: center; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; background: rgba(0,0,0,.6); }
  .ch .del { position: absolute; right: 4px; top: 4px; width: 20px; height: 20px; border-radius: 50%; border: 0; display: none;
    background: rgba(0,0,0,.65); color: #fff; font-size: 12px; line-height: 20px; padding: 0; cursor: pointer; }
  .ch:hover .del { display: block; }
  .ch.add { display: grid; place-items: center; height: 70px; font-size: 26px; color: #ccc; background: rgba(0,0,0,.45); }
  .ch.busy .img { filter: brightness(.35); }
  .ch.busy::after { content: ""; position: absolute; left: 50%; top: 46px; width: 22px; height: 22px; margin: -11px 0 0 -11px;
    border-radius: 50%; border: 2px solid rgba(255,255,255,.25); border-top-color: #fff; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #newchar { position: fixed; right: 124px; top: 50%; transform: translateY(-50%); display: none; gap: 8px; padding: 10px;
    border-radius: 14px; background: rgba(12,12,16,.92); border: 1px solid rgba(255,255,255,.16); }
  #newchar input { width: 230px; padding: 9px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.2); background: #000;
    color: #fff; font: 14px "Segoe UI", sans-serif; outline: none; }
  #newchar button { border: 0; border-radius: 10px; padding: 0 14px; font: 700 13px "Segoe UI", sans-serif; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="world" style="display:none"></canvas>
<div id="top"><b>BRINKO</b><span id="state">STARTING…</span></div>
<button id="camsw" title="Switch camera"></button>
<button id="close" title="Close (Esc)">✕</button>
<div id="picker"></div>
<div id="newchar"><input placeholder="Any character, e.g. Spider-Man" maxlength="40"><button>Create</button></div>
<div id="hint" style="opacity:0">Hold both hands up and spread thumb + index finger: the space between your fingertips becomes a window into another world. Move both hands out of view to step all the way in.</div>
<div id="msg"><div>Loading…</div></div>

<script type="module">
import { FilesetResolver, HandLandmarker, FaceDetector, ImageSegmenter } from "./vendor/vision_bundle.mjs";

// Two modes: FILTER worlds (default) and CHARACTERS (hidden for now, ?chars=1 brings them back).
const CHARS = new URLSearchParams(location.search).has("chars");
if (!CHARS) document.documentElement.classList.add("nochars");

const $ = (s) => document.querySelector(s);
const cv = $("#c"), ctx = cv.getContext("2d");
let W = 0, H = 0;
const DPR = Math.min(2, devicePixelRatio || 1);
function resize() { W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
resize(); addEventListener("resize", resize);

// ───────────────────────── camera ─────────────────────────
const video = document.createElement("video"); video.playsInline = true; video.muted = true;
let stream = null, hands = null, face = null, running = true;
window.__brinkoStop = () => { running = false; stream?.getTracks().forEach((t) => t.stop()); };
$("#close").onclick = () => { window.__brinkoStop(); window.close(); };

// Virtual cameras (TranScreen, OBS, DroidCam…) show nothing useful, so prefer a real webcam.
const VIRTUAL = /virtual|transcreen|obs|droidcam|wo ?webcam|iriun|epoccam|snap camera|xsplit|manycam|nvidia broadcast|camo|ndi|splitcam/i;
const store = { get: (k) => { try { return localStorage.getItem("brinkcam." + k); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem("brinkcam." + k, v); } catch {} } };
let cams = [];
function ask() {
  return new Promise((resolve) => {
    if (store.get("allowed") === "2") return resolve(true);
    $("#msg").innerHTML = `<div class="card">
        <div style="font-size:34px">📷</div><h2>BRINKO wants to use your camera</h2>
        <p>Hand tracking and the effects run on this PC and the camera image never leaves it.</p>
        <div class="row"><button class="yes">Allow camera</button><button class="no">Not now</button></div>
        <small>You can switch cameras with the 🎥 button.</small></div>`;
    $("#msg .yes").onclick = () => { store.set("allowed", "2"); resolve(true); };
    $("#msg .no").onclick = () => resolve(false);
  });
}
function explain(e) {
  const n = e && e.name;
  if (n === "NotReadableError" || n === "TrackStartError") return "Another app is using the camera right now (Zoom, Discord, Teams, OBS, the Camera app…). Close it and try again.";
  if (n === "NotAllowedError" || n === "SecurityError") return "Windows is blocking camera access. Open Settings → Privacy & security → Camera and turn on “Let desktop apps access your camera”.";
  if (n === "NotFoundError" || n === "OverconstrainedError") return "No camera was found. Is the webcam plugged in?";
  if (n === "Timeout") return "The camera didn't respond. Unplug and replug it, or close apps that might be using it.";
  return `${n || "Error"}: ${(e && e.message) || e}`;
}
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ name: "Timeout" }), ms))]);
async function openCam(deviceId) {
  stream?.getTracks().forEach((t) => t.stop());
  const v = { width: { ideal: 1280 }, height: { ideal: 720 } };
  if (deviceId) v.deviceId = { exact: deviceId };
  stream = await withTimeout(navigator.mediaDevices.getUserMedia({ video: v, audio: false }), 12000);
  window.__usedLabel = stream.getVideoTracks()[0]?.label;
  video.srcObject = stream; await video.play();
  const cur = cams.find((c) => c.deviceId === stream.getVideoTracks()[0]?.getSettings().deviceId);
  $("#camsw").textContent = "🎥 " + (cur ? cur.label.replace(/\s*\([0-9a-f:]+\)\s*$/i, "") : "Camera");
  $("#camsw").style.display = cams.length > 1 ? "block" : "none";
}
async function pickAndOpen() {
  const probe = await withTimeout(navigator.mediaDevices.getUserMedia({ video: true, audio: false }), 12000);
  cams = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "videoinput");
  probe.getTracks().forEach((t) => t.stop());
  const saved = store.get("device");
  const choice = cams.find((c) => c.deviceId === saved) || cams.find((c) => !VIRTUAL.test(c.label)) || cams[0];
  await openCam(choice && choice.deviceId);
}
$("#camsw").onclick = async () => {
  if (cams.length < 2) return;
  const curId = stream?.getVideoTracks()[0]?.getSettings().deviceId;
  const next = cams[(cams.findIndex((c) => c.deviceId === curId) + 1) % cams.length];
  try { await openCam(next.deviceId); store.set("device", next.deviceId); } catch (e) { console.error("camera switch failed", e && e.name); }
};

// ───────────────────────── filter worlds (WebGL) ─────────────────────────
// The camera image restyled: you (cut out with the body mask) in a different look, in front
// of a different place. Drawn mirrored and lined up with the live picture.
const WORLDS = ["SPIDER-VERSE", "ANIME", "COMIC", "SYNTHWAVE", "HOLOGRAM", "THERMAL"];
let worldIdx = 0;
const wcv = $("#world");
const gl = wcv.getContext("webgl", { premultipliedAlpha: false, preserveDrawingBuffer: true });
const FRAG = `
precision mediump float;
uniform sampler2D cam, mask; uniform vec2 res; uniform float t; uniform int style;
varying vec2 uv;
float hash(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
float fbm(vec2 p){ float v=0., a=.5; for(int i=0;i<5;i++){ v+=a*noise(p); p*=2.02; a*=.5; } return v; }
float lum(vec3 c){ return dot(c, vec3(.299,.587,.114)); }
float edge(vec2 p){
  vec2 px = 1.2 / res;
  float tl=lum(texture2D(cam,p+px*vec2(-1,-1)).rgb), t0=lum(texture2D(cam,p+px*vec2(0,-1)).rgb), tr=lum(texture2D(cam,p+px*vec2(1,-1)).rgb);
  float l=lum(texture2D(cam,p+px*vec2(-1,0)).rgb), r=lum(texture2D(cam,p+px*vec2(1,0)).rgb);
  float bl=lum(texture2D(cam,p+px*vec2(-1,1)).rgb), b0=lum(texture2D(cam,p+px*vec2(0,1)).rgb), br=lum(texture2D(cam,p+px*vec2(1,1)).rgb);
  float gx = -tl-2.*l-bl+tr+2.*r+br, gy = -tl-2.*t0-tr+bl+2.*b0+br;
  return length(vec2(gx,gy));
}
vec3 thermal(float x){
  x = clamp(x,0.,1.);
  vec3 c = mix(vec3(0.,0.,.25), vec3(.45,0.,.6), smoothstep(0.,.25,x));
  c = mix(c, vec3(.95,.1,.2), smoothstep(.25,.5,x));
  c = mix(c, vec3(1.,.65,0.), smoothstep(.5,.75,x));
  return mix(c, vec3(1.,1.,.85), smoothstep(.75,1.,x));
}
void main(){
  vec2 p = uv;
  vec3 c = texture2D(cam, p).rgb;
  float m = smoothstep(.35, .65, texture2D(mask, p).r);
  float e = edge(p);
  vec3 person, bg;
  float aspect = res.x / res.y;
  vec2 q = vec2((p.x - .5) * aspect, p.y);
  if (style == 0) {           // SPIDER-VERSE: ink-black suit, a few sharp neon outlines, print offset
    vec2 off = vec2(5. / res.x, 0.);
    float L = lum(c);
    float ink = smoothstep(.42, .75, e);                        // only strong edges become lines
    vec3 suit = vec3(.015,.012,.03) + vec3(.10,.08,.18) * smoothstep(.25, .9, L);
    float spec = smoothstep(.72, .95, L) * .35;                 // glossy highlights on the suit
    person = suit + vec3(.55,.5,.9) * spec;
    person = mix(person, vec3(1.,.1,.25), ink * .95);
    person.r += .7 * smoothstep(.45, .8, edge(p + off)) * (1. - ink);
    person.b += .8 * smoothstep(.45, .8, edge(p - off)) * (1. - ink);
    person.g += .35 * smoothstep(.45, .8, edge(p - off)) * (1. - ink);
    mat2 R = mat2(.707,-.707,.707,.707);
    vec2 hp = fract(R * (p * res / 6.)) - .5;
    float dots = smoothstep(.22, .18, length(hp));
    vec3 city = mix(vec3(.10,.03,.22), vec3(.85,.22,.5), smoothstep(.15, .95, p.y));
    float bld = step(p.y, .98 - .38 * step(.5, fract(q.x * 3.7)) * noise(vec2(floor(q.x * 11.), 1.)));
    city = mix(city, vec3(.04,.01,.09), bld * .85);
    float win = step(.88, hash(floor(vec2(q.x * 150., p.y * 120.)))) * bld * step(.45, p.y);
    bg = city + vec3(.22,.04,.28) * dots + vec3(1.,.75,.35) * win * .45;
    bg.b += .2 * smoothstep(.3, 1., fbm(q * 3. + t * .05));
  } else if (style == 1) {    // ANIME: cel shading + ink lines, sunny anime sky
    float L = lum(c);
    vec3 hue = clamp(c / max(L, .04), 0., 2.);
    hue = mix(vec3(1.), hue, 1.4 * smoothstep(.06, .3, L));
    float lit = pow(L, .55);
    float band = lit < .38 ? .42 : (lit < .62 ? .66 : .9);
    vec3 s = clamp(hue * band, 0., 1.) * vec3(.92, .95, 1.06);
    person = mix(s, vec3(.08,.06,.12), smoothstep(.2, .45, e));
    vec3 sky = mix(vec3(.25,.55,.98), vec3(.75,.92,1.), smoothstep(.0, .75, p.y));
    float cl = smoothstep(.55, .75, fbm(vec2(q.x*2.2 + t*.02, p.y*3.5))) * (1. - smoothstep(.45, .7, p.y));
    sky = mix(sky, vec3(1.), cl * .9);
    float sun = smoothstep(.13, .11, length(q - vec2(.275*aspect, .18)));
    sky = mix(sky, vec3(1.,.97,.85), sun);
    float hill = .78 + .05*sin(q.x*3.1 + 1.) + .03*sin(q.x*7.3);
    bg = p.y > hill ? mix(vec3(.38,.75,.35), vec3(.22,.55,.25), smoothstep(hill, 1., p.y)) : sky;
  } else if (style == 2) {    // COMIC: halftone + bold ink, pop-art burst
    float L = lum(c);
    mat2 R = mat2(.707,-.707,.707,.707);
    vec2 hp = fract(R * (p * res / 7.)) - .5;
    float dots = smoothstep(.0, .06, (1. - pow(L, .5)) * .62 - length(hp));
    vec3 hue = mix(vec3(1.), clamp(c / max(L, .04), 0., 2.), 1.6 * smoothstep(.06, .3, L));
    float lit = pow(L, .5);
    vec3 base = clamp(hue * (lit < .45 ? .5 : .88), 0., 1.);
    person = mix(base * (1. - dots * .45), vec3(0.), smoothstep(.18, .4, e));
    float ang = atan(q.y - .45, q.x);
    float rays = step(.5, fract(ang * 3.18 + t * .05));
    bg = mix(vec3(1.,.82,.1), vec3(1.,.25,.2), rays);
    vec2 bh = fract(R * (p * res / 9.)) - .5;
    bg = mix(bg, bg * .7, smoothstep(.2, .18, length(bh)));
  } else if (style == 3) {    // SYNTHWAVE: glowing outline person, retro sun + moving grid
    float L = lum(c);
    person = vec3(.08,.0,.14) + vec3(.25,.0,.35) * L + vec3(.2,.9,1.) * smoothstep(.12, .4, e) * 1.6;
    vec3 sky = mix(vec3(.08,.0,.18), vec3(.95,.25,.55), smoothstep(.0, .62, p.y));
    vec2 sc = q - vec2(0., .48); float sr = length(sc);
    float band = step(.0, sin((p.y - .3) * 90.)) + step(.5, -sc.y / .25);
    float sun = smoothstep(.27, .26, sr) * (sc.y < .0 ? 1. : 0.) * min(1., band);
    sky = mix(sky, mix(vec3(1.,.9,.3), vec3(1.,.3,.5), smoothstep(-.27, 0., sc.y)), sun);
    if (p.y > .62) {
      float d = (p.y - .6); vec2 gp = vec2(q.x / d, 1. / d + t * 1.2);
      float gx = smoothstep(.06, .0, abs(fract(gp.x * .5) - .5)) + smoothstep(.08, .0, abs(fract(gp.y * .5) - .5));
      sky = mix(vec3(.05,.0,.1), vec3(1.,.2,.8), clamp(gx, 0., 1.) * smoothstep(.62, .75, p.y));
    }
    bg = sky;
  } else if (style == 4) {    // HOLOGRAM in space
    float L = lum(c);
    float scan = .75 + .25 * sin(p.y * res.y * .9 + t * 12.);
    float flick = .9 + .1 * sin(t * 37.) * sin(t * 13.);
    person = vec3(.25,.75,1.) * (L * 1.4 + smoothstep(.1,.3,e)) * scan * flick;
    vec3 neb = vec3(.1,.02,.2) + vec3(.35,.1,.5) * fbm(q*2.5 + t*.01) + vec3(.05,.2,.4) * fbm(q*4. - 3.);
    float st = step(.996, hash(floor(p * res / 2.)));
    bg = neb * .8 + st;
    m *= .85;
  } else {                    // THERMAL
    float L = lum(c);
    person = thermal(.45 + L * .55 + .08 * sin(t * 2. + p.y * 9.));
    bg = thermal(.08 + .15 * fbm(q * 3. + t * .05));
  }
  gl_FragColor = vec4(mix(bg, person, m), 1.);
}`;
let texCam, texMask, uStyle, uT, uRes, glReady = false, seg = null, maskBuf = null;
function initGL() {
  const sh = (type, src) => { const x = gl.createShader(type); gl.shaderSource(x, src); gl.compileShader(x);
    if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, "attribute vec2 a; varying vec2 uv; void main(){ uv = vec2(a.x*.5+.5, .5-a.y*.5); gl_Position = vec4(a,0.,1.); }"));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FRAG)); gl.linkProgram(prog); gl.useProgram(prog);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, "a"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const mkTex = (unit) => { const x = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, x);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); return x; };
  texCam = mkTex(0); texMask = mkTex(1);
  gl.uniform1i(gl.getUniformLocation(prog, "cam"), 0); gl.uniform1i(gl.getUniformLocation(prog, "mask"), 1);
  uStyle = gl.getUniformLocation(prog, "style"); uT = gl.getUniformLocation(prog, "t"); uRes = gl.getUniformLocation(prog, "res");
  gl.activeTexture(gl.TEXTURE1); gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, 1, 1, 0, gl.LUMINANCE, gl.UNSIGNED_BYTE, new Uint8Array([0]));
  glReady = true;
}
try { initGL(); } catch (e) { console.error("world shader failed:", e.message || e); }
function updateMask(src, now) {
  if (!seg) return;
  const t0 = performance.now();
  seg.segmentForVideo(src, now, (res) => {
    const m = res.confidenceMasks && res.confidenceMasks[0]; if (!m) return;
    const f = m.getAsFloat32Array();
    if (!maskBuf || maskBuf.length !== f.length) maskBuf = new Uint8Array(f.length);
    for (let i = 0; i < f.length; i++) maskBuf[i] = f[i] * 255;
    gl.activeTexture(gl.TEXTURE1); gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, m.width, m.height, 0, gl.LUMINANCE, gl.UNSIGNED_BYTE, maskBuf);
  });
  perf.seg = (perf.seg || 0) * .9 + (performance.now() - t0) * .1;
}
let worldAt = -1;
function renderWorld(now) {
  if (worldAt === lastVideoTime && !fakeHands) return wcv;     // one shader pass per camera frame
  worldAt = lastVideoTime;
  const w = Math.round(vw * .75), h = Math.round(vh * .75);
  if (wcv.width !== w || wcv.height !== h) { wcv.width = w; wcv.height = h; }
  gl.viewport(0, 0, w, h);
  gl.activeTexture(gl.TEXTURE0); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, video);
  gl.uniform1i(uStyle, worldIdx); gl.uniform1f(uT, now / 1000); gl.uniform2f(uRes, w, h);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  return wcv;
}
function nextWorld() { worldIdx = (worldIdx + 1) % WORLDS.length; store.set("world", String(worldIdx)); }

// ───────────────────────── characters ─────────────────────────
// Each character is one picture (character from the waist up + its scene) with the
// position of its face. Inside the portal the picture is placed so that face sits
// on YOUR face: whatever part of you the frame covers shows that part of them.
let chars = [], cur = -1;
const charUrl = (c) => "./characters/" + c.file + (c.v ? "?v=" + c.v : "");
async function loadChars() {
  try { chars = await (await fetch("/fx/api/characters")).json(); } catch { chars = []; }
  await Promise.all(chars.map(prepChar));
  renderPicker();
}
async function prepChar(c) {
